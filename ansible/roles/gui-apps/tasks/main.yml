---
# GUI apps that need deep system integration (sandboxing, GPU drivers) are
# installed natively via apt instead of Nix. This sidesteps the setuid
# sandbox problem for Brave and the OpenGL/driver-linking problem for
# WezTerm entirely, rather than working around them with nixGL/setuid hacks.

# --- Add apt keyrings + sources (Brave, WezTerm, VS Code) -------------------

- name: Add Brave apt keyring
  get_url:
    url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
    dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
    mode: "0644"
  become: true
  register: brave_keyring

# DEB822 .sources file, not the older .list format.
- name: Add Brave apt source
  get_url:
    url: https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
    dest: /etc/apt/sources.list.d/brave-browser-release.sources
    mode: "0644"
  become: true
  register: brave_source

- name: Add WezTerm apt keyring
  shell: |
    curl -fsSL https://apt.fury.io/wez/gpg.key | gpg --yes --dearmor -o /usr/share/keyrings/wezterm-fury.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/wezterm-fury.gpg
  become: true
  register: wezterm_keyring

- name: Add WezTerm apt source
  copy:
    dest: /etc/apt/sources.list.d/wezterm.list
    content: "deb [signed-by=/usr/share/keyrings/wezterm-fury.gpg] https://apt.fury.io/wez/ * *\n"
    mode: "0644"
  become: true
  register: wezterm_source

- name: Add VS Code apt keyring
  shell: |
    curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --yes --dearmor -o /usr/share/keyrings/microsoft.gpg
  args:
    executable: /bin/bash
    creates: /usr/share/keyrings/microsoft.gpg
  become: true
  register: vscode_keyring

- name: Add VS Code apt source
  copy:
    dest: /etc/apt/sources.list.d/vscode.list
    content: "deb [arch=amd64,arm64,armhf signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main\n"
    mode: "0644"
  become: true
  register: vscode_source

- name: Update apt cache for new repos
  apt:
    update_cache: true
  become: true
  when: >
    brave_keyring is changed or brave_source is changed or
    wezterm_keyring is changed or wezterm_source is changed or
    vscode_keyring is changed or vscode_source is changed

# --- Install packages -------------------------------------------------------

- name: Install Brave
  apt:
    name: brave-browser
    state: present
  become: true

- name: Install WezTerm
  apt:
    name: wezterm
    state: present
  become: true

- name: Install VS Code
  apt:
    name: code
    state: present
  become: true

# --- Make WezTerm the default terminal --------------------------------------

- name: Check default x-terminal-emulator
  command: update-alternatives --query x-terminal-emulator
  register: term_alt
  changed_when: false
  failed_when: false

- name: Register WezTerm as x-terminal-emulator alternative
  command: update-alternatives --install /usr/bin/x-terminal-emulator x-terminal-emulator /usr/bin/wezterm 100
  become: true
  when: "'/usr/bin/wezterm' not in term_alt.stdout"

- name: Set WezTerm as default x-terminal-emulator
  command: update-alternatives --set x-terminal-emulator /usr/bin/wezterm
  become: true
  when: "'Value: /usr/bin/wezterm' not in term_alt.stdout"
