---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages required for Nix + provisioning
  apt:
    name:
      - curl
      - git
      - build-essential
      - ca-certificates
      - gnupg
      - xz-utils
      - file
    state: present
  become: true
